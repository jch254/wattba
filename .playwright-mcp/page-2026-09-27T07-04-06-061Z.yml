          - generic [ref=e146]:
            - heading "Delta & Git" [level=1] [ref=e147]
            - paragraph [ref=e148]: How Delta records your work, and how that record connects to git.
        - navigation "On this page (mobile)" [ref=e150]:
          - group [ref=e151]:
            - generic "On this page What is DeltaDB?" [ref=e152] [cursor=pointer]:
              - generic [ref=e153]: On this page
              - generic [ref=e156]: What is DeltaDB?
        - article [ref=e157]:
          - paragraph [ref=e158]: Delta records your work continuously. Changes to files included in DeltaDB, whether made by you or the agent, are saved as they happen rather than only when someone commits. Each connected Delta client holds a copy of the database, and Delta keeps the copies in sync, so everyone sees the same history.
          - heading [level=2] [ref=e159]:
            - link "What is DeltaDB?" [ref=e160] [cursor=pointer]:
              - /url: "#what-is-deltadb"
          - paragraph [ref=e161]:
            - text: DeltaDB is the shared database behind a Delta thread. It records thread messages,
            - link "comments" [ref=e162] [cursor=pointer]:
              - /url: /docs/agents/comments
            - text: ", Delta worktree changes, and file edits as"
            - link "deltas" [ref=e163] [cursor=pointer]:
              - /url: "#what-is-a-delta"
            - text: . Agents can read and edit a Delta worktree’s shared file representation in DeltaDB. On desktop machines, Delta can also materialize those files in folders called checkouts, where people and filesystem-based tools can edit them. Browser participants and browser-run agents use the replicated file representation directly, without a checkout. DeltaDB records the edits and synchronizes every mounted checkout.
          - heading [level=2] [ref=e164]:
            - link "What is a delta?" [ref=e165] [cursor=pointer]:
              - /url: "#what-is-a-delta"
          - paragraph [ref=e166]: A delta is a recorded change to a thread or Delta worktree. It can represent a file edit, a change to the file tree, a message, a comment, or another update to shared state. Each delta records who made the change and where it belongs in the thread’s history. This allows DeltaDB to combine changes from different participants and keep every copy synchronized.
          - paragraph [ref=e167]: Unlike a git commit, a delta is created continuously as work happens. You do not need to stage or commit it.
          - heading [level=2] [ref=e168]:
            - link "Open a project" [ref=e169] [cursor=pointer]:
              - /url: "#open-a-project"
          - paragraph [ref=e170]: The folder you open as a project must be the top-level folder of a Git checkout. Delta does not currently accept an arbitrary folder inside one.
          - paragraph [ref=e171]: Delta imports every file Git tracks, including tracked files whose paths now match an ignore rule. It also imports uncommitted changes to tracked files and untracked files that Git does not ignore. After the import, DeltaDB records changes to those files as they happen. Commits stay in Git. Delta moves them between machines as needed, so a collaborator’s machine can get your current commit without a round trip through origin.
          - paragraph [ref=e172]:
            - text: Delta preserves each file’s line endings when it writes a checkout and honors Git’s
            - code [ref=e173]: core.autocrlf
            - text: ","
            - code [ref=e174]: core.eol
            - text: ", and"
            - code [ref=e175]: .gitattributes
            - text: conversion rules. This keeps CRLF repositories and Windows checkouts from showing every file as modified in
            - code [ref=e176]: git status
            - text: .
          - paragraph [ref=e177]:
            - text: The shared representation and its checkouts are two ways to work with the same Delta worktree. The agent’s direct file operations can use the representation in DeltaDB; terminal commands and other filesystem-based tools run in a checkout. Delta keeps both synchronized.
            - link "Delta Worktrees" [ref=e178] [cursor=pointer]:
              - /url: /docs/concepts/worktrees
            - text: explains where checkouts live.
          - heading [level=2] [ref=e179]:
            - link "Jujutsu repositories" [ref=e180] [cursor=pointer]:
              - /url: "#jujutsu-repositories"
          - paragraph [ref=e181]:
            - text: Delta has early support for Jujutsu (
            - code [ref=e182]: jj
            - text: ) repositories that use colocated mode, with
            - code [ref=e183]: .git
            - text: and
            - code [ref=e184]: .jj
            - text: in the same project folder. When the project you open is colocated, Delta runs
            - code [ref=e185]: jj git init --colocate
            - text: in each managed checkout it creates and tracks the default remote branch and your checkout’s upstream, so the agent’s checkouts are colocated too. Jujutsu must be installed for this to succeed; a checkout adopted in place is left as it is.
          - paragraph [ref=e186]:
            - text: Delta preserves a managed checkout’s Jujutsu operation log when the checkout is archived and restores it when the checkout is mounted again. On mount, Delta fetches bookmarks from your source checkout through the
            - code [ref=e187]: local
            - text: remote and copies selected repository settings for identity, signing, and
            - code [ref=e188]: trunk()
            - text: behavior. Arbitrary aliases and executable configuration remain isolated from the managed checkout.
          - paragraph [ref=e189]:
            - text: Jujutsu support remains incomplete. If you see unexpected behavior, email
            - link "delta-beta@zed.dev" [ref=e190] [cursor=pointer]:
              - /url: mailto:delta-beta@zed.dev
            - text: .
          - heading [level=2] [ref=e191]:
            - link "The two remotes" [ref=e192] [cursor=pointer]:
              - /url: "#the-two-remotes"
          - paragraph [ref=e193]:
            - text: "A checkout that Delta creates from your own project folder has two git remotes. Your repository needs a remote of its own for this: a thread on a repository with no remote works locally, but cannot be"
            - link "shared" [ref=e194] [cursor=pointer]:
              - /url: /docs/collaboration/collaborate-thread
            - text: until you add and push one.
          - list [ref=e195]:
            - listitem [ref=e196]:
              - strong [ref=e197]: origin
              - text: ": the shared upstream your repository already points at, such as GitHub. When you ask the agent to publish a branch or open a pull request, it pushes to origin by default."
            - listitem [ref=e198]:
              - strong [ref=e199]: local
              - text: ": your own repository on your machine. The agent can push a branch to local to hand you work without a round trip through GitHub, including the branch you have checked out: a clean checkout updates in place, and git rejects a push that would overwrite local edits."
          - paragraph [ref=e200]:
            - text: On a teammate’s machine (they joined the thread without having the project),
            - code [ref=e201]: origin
            - text: is the same shared upstream, but
            - code [ref=e202]: local
            - text: points at Delta’s own clone of the repository rather than at a checkout of theirs.
          - heading [level=2] [ref=e203]:
            - link "How work comes back out" [ref=e204] [cursor=pointer]:
              - /url: "#how-work-comes-back-out"
          - paragraph [ref=e205]: "The agent’s changes reach files you use in four ways:"
          - list [ref=e206]:
            - listitem [ref=e207]:
              - strong [ref=e208]: In place.
              - text: A thread can adopt your own project folder as its checkout. Your uncommitted changes come along with it, and the agent’s edits appear in your project folder directly.
            - listitem [ref=e209]:
              - strong [ref=e210]: Through local.
              - text: The agent pushes a branch to the
              - code [ref=e211]: local
              - text: remote, straight into your repository. Pushing the branch you have checked out updates your working tree in place when it is clean.
            - listitem [ref=e212]:
              - strong [ref=e213]: Through origin.
              - text: The agent pushes a branch to origin. You fetch that branch into your own checkout, or review it as a pull request.
            - listitem [ref=e214]:
              - strong [ref=e215]: From the checkout.
              - text: A Delta-managed checkout is a real folder. You can open it in Zed, build in it, or copy files out of it.
          - paragraph [ref=e216]:
            - text: See
            - link "Review & Sync Changes" [ref=e217] [cursor=pointer]:
              - /url: /docs/agents/review-and-sync
            - text: for step-by-step commands.
          - heading [level=2] [ref=e218]:
            - link "What Delta records that git doesn’t" [ref=e219] [cursor=pointer]:
              - /url: "#what-delta-records-that-git-doesnt"
          - paragraph [ref=e220]: Git records a snapshot of the repository each time someone commits. DeltaDB records each edit, from each person and the agent, in the order it is made. You can review and comment on anyone’s work, agent or collaborator, in the middle of a turn, and revert the conversation to an earlier point, restoring the thread’s Delta worktrees along with it. None of it involves a commit.
          - paragraph [ref=e221]:
            - text: For untracked files, the record follows your repository’s
            - code [ref=e222]: .gitignore
            - text: . Untracked ignored files are not recorded or synced, so build artifacts and untracked
            - code [ref=e223]: .env
            - text: files stay on the machine where they were created.
          - generic [ref=e224]:
            - paragraph [ref=e225]: WARNING
            - paragraph [ref=e226]:
              - text: Adding a path to
              - code [ref=e227]: .gitignore
              - text: does not protect a file Git already tracks. Delta still imports tracked files that match an ignore rule.
